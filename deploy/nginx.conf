# Example Nginx reverse proxy for Next.js + WebSocket server
# - Serves Next.js app on https://your-domain
# - Proxies WebSocket connections at /ws to the WS server (port 3001)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    server_name your-domain.com;

    # App (Next.js)
    location / {
      proxy_pass http://web:3000; # container name or IP of Next.js
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (terminal)
    location /ws {
      proxy_pass http://web:3001; # same container exposing 3001
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600;
    }
  }
}
