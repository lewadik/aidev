version: "3.8"
services:
  web:
    build: ..
    container_name: aidev-web
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WS_PORT=3001
      # Use path-based WS via Nginx; client will default to wss://domain/ws
      # - NEXT_PUBLIC_WS_URL=wss://your-domain.com/ws
    volumes:
      - ../uploads:/app/uploads
    expose:
      - "3000"
      - "3001"

  nginx:
    image: nginx:stable
    container_name: aidev-nginx
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
